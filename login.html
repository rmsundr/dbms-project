<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClinicRx — Secure Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/style.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #c8ebe6 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #dceee8 0%, transparent 45%),
        linear-gradient(160deg, #eef6f4 0%, #f5f8f7 45%, #e9f2ef 100%);
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow);
    }
    .brand.center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .brand-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-deep));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .brand-icon svg {
      width: 26px;
      height: 26px;
    }
    .brand.center strong {
      font-size: 1.4rem;
      color: var(--ink);
    }
    .brand.center span {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .login-card h2 {
      text-align: center;
      margin-bottom: 0.2rem;
      font-size: 1.4rem;
    }
    .login-card > p {
      text-align: center;
      color: var(--muted);
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }
    .role-tabs {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
      background: rgba(255, 255, 255, 0.6);
      padding: 0.25rem;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .role-tabs button {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
      font-size: 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .role-tabs button:hover {
      color: var(--ink);
    }
    .role-tabs button.active {
      background: #fff;
      color: var(--brand);
      box-shadow: 0 4px 12px rgba(11, 110, 106, 0.15);
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
      font-weight: 600;
    }
    .form-group select,
    .form-group input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 0.7rem 0.85rem;
      color: var(--ink);
      font-size: 0.95rem;
    }
    .login-demo {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      padding: 0.85rem 1rem;
      background: rgba(11, 110, 106, 0.04);
      border: 1px solid rgba(11, 110, 106, 0.12);
      border-radius: 10px;
      margin-bottom: 1.25rem;
      font-size: 0.82rem;
      color: var(--ink-soft);
      line-height: 1.45;
    }
    .login-demo svg {
      flex-shrink: 0;
      margin-top: 0.1rem;
      color: var(--brand);
    }
    .btn.primary.wide {
      width: 100%;
      padding: 0.85rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="brand center">
        <div class="brand-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 1 0 7.78l-8 8a5.5 5.5 0 0 1-7.78 0l-8-8a5.5 5.5 0 0 1 0-7.78l8-8a5.5 5.5 0 0 1 7.78 0z" />
            <path d="M12 18v-6" />
            <path d="M9 12h6" />
          </svg>
        </div>
        <div>
          <strong>ClinicRx</strong>
          <span>E-Prescription Workflow System</span>
        </div>
      </div>
      <h2>Secure Sign In</h2>
      <p>Select role to access clinic portals.</p>

      <div class="role-tabs" id="role-tabs">
        <button class="active" data-role="doctor">Doctor</button>
        <button data-role="staff">Staff</button>
        <button data-role="admin">Admin</button>
      </div>

      <!-- Doctor Specialty Selection View -->
      <div id="view-doctor" class="role-view">
        <div class="form-group">
          <label for="select-doctor">Select Specialty Doctor</label>
          <select id="select-doctor">
            <option value="">Loading specialties & doctors...</option>
          </select>
        </div>
      </div>

      <!-- Staff Selection View -->
      <div id="view-staff" class="role-view" style="display:none;">
        <div class="form-group">
          <label for="select-staff">Select Staff Account</label>
          <select id="select-staff">
            <option value="staff.anjali" data-name="Anjali Staff">Anjali Staff — Reception & Billing</option>
            <option value="staff.rahul" data-name="Rahul Staff">Rahul Staff — Laboratory & Inventory</option>
          </select>
        </div>
      </div>

      <!-- Admin View -->
      <div id="view-admin" class="role-view" style="display:none;">
        <div class="form-group">
          <label>Administrator Account</label>
          <input type="text" value="System Administrator (admin.system)" readonly />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password / Security PIN</label>
        <input type="password" id="password" value="clinic2026" placeholder="Enter password" />
      </div>

      <div class="login-demo" id="role-description">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span id="desc-text">Doctor can create prescriptions with specialty-filtered medicine access and automated conflict checking.</span>
      </div>

      <button class="btn primary wide" id="btn-login">Sign In as Doctor</button>
    </div>
  </div>

  <script>
    const DESCRIPTIONS = {
      doctor: 'Doctor can create prescriptions with specialty-filtered medicine access and automated conflict checking.',
      staff: 'Staff manages patient registration, appointments, inventory, laboratory requests and billing.',
      admin: 'Admin has full system access including configuration, doctor privileges, audit logs and master data.'
    };

    let currentRole = 'doctor';
    let doctorsMap = {};

    document.addEventListener('DOMContentLoaded', async () => {
      const logged = localStorage.getItem('clinic_logged');
      const role = localStorage.getItem('clinic_role');
      if (logged === 'true' && role) {
        window.location.href = 'index.html';
        return;
      }

      setupTabs();
      await loadDoctors();
      setupLogin();
    });

    function setupTabs() {
      const tabs = document.querySelectorAll('#role-tabs button');
      tabs.forEach(btn => {
        btn.addEventListener('click', () => {
          tabs.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentRole = btn.dataset.role;

          document.querySelectorAll('.role-view').forEach(v => v.style.display = 'none');
          document.getElementById(`view-${currentRole}`).style.display = 'block';

          document.getElementById('desc-text').textContent = DESCRIPTIONS[currentRole];
          updateLoginButtonText();
        });
      });
    }

    async function loadDoctors() {
      const select = document.getElementById('select-doctor');
      try {
        const res = await fetch('/api/doctors');
        const doctors = await res.json();
        if (Array.isArray(doctors) && doctors.length > 0) {
          select.innerHTML = '';
          doctors.forEach(doc => {
            doctorsMap[doc.doctor_id] = doc;
            const opt = document.createElement('option');
            opt.value = doc.doctor_id;
            opt.textContent = `${doc.doctor_name} — ${doc.speciality_name} (${(doc.qualifications || []).join(', ') || 'MD'})`;
            select.appendChild(opt);
          });
        } else {
          fallbackDoctors(select);
        }
      } catch (err) {
        console.warn('Failed to fetch dynamic doctors from backend, using default list:', err);
        fallbackDoctors(select);
      }
    }

    function fallbackDoctors(select) {
      doctorsMap = {
        1: { doctor_id: 1, doctor_name: 'Dr. Anitha Menon', speciality_name: 'Cardiology' },
        2: { doctor_id: 2, doctor_name: 'Dr. Rajesh Kumar', speciality_name: 'Endocrinology' },
        3: { doctor_id: 3, doctor_name: 'Dr. Sreelatha Nair', speciality_name: 'General Medicine' },
        4: { doctor_id: 4, doctor_name: 'Dr. Mohammed Ali', speciality_name: 'Geriatrics' },
        5: { doctor_id: 5, doctor_name: 'Dr. Priya Varma', speciality_name: 'Nephrology' }
      };
      select.innerHTML = '';
      Object.values(doctorsMap).forEach(doc => {
        const opt = document.createElement('option');
        opt.value = doc.doctor_id;
        opt.textContent = `${doc.doctor_name} — ${doc.speciality_name}`;
        select.appendChild(opt);
      });
    }

    function updateLoginButtonText() {
      const roleName = currentRole.charAt(0).toUpperCase() + currentRole.slice(1);
      document.getElementById('btn-login').textContent = `Sign In as ${roleName}`;
    }

    function setupLogin() {
      document.getElementById('btn-login').addEventListener('click', async () => {
        let userObj = {};
        let payload = { role: currentRole };

        if (currentRole === 'doctor') {
          const docId = Number(document.getElementById('select-doctor').value);
          const doc = doctorsMap[docId] || { doctor_id: docId, doctor_name: 'Doctor', speciality_name: 'General Medicine' };
          payload.doctor_id = doc.doctor_id;
          payload.specialty_id = doc.speciality_id;
          userObj = { id: doc.doctor_id, name: doc.doctor_name, role: 'doctor', specialty: doc.speciality_name };
        } else if (currentRole === 'staff') {
          const sel = document.getElementById('select-staff');
          const opt = sel.options[sel.selectedIndex];
          payload.username = sel.value;
          userObj = { id: sel.value, name: opt.dataset.name, role: 'staff' };
        } else {
          payload.username = 'admin.system';
          userObj = { id: 'ADM001', name: 'System Admin', role: 'admin' };
        }

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data && data.user) {
            userObj = data.user;
          }
        } catch (err) {
          console.warn('Backend login verification offline, proceeding with local session:', err);
        }

        localStorage.setItem('clinic_role', currentRole);
        localStorage.setItem('clinic_user', JSON.stringify(userObj));
        localStorage.setItem('clinic_logged', 'true');
        window.location.href = 'index.html';
      });
    }
  </script>
</body>
</html>
